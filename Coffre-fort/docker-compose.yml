services:
  auth-service:
    build: ./auth-service
    volumes:
      - "./keys/jwt_private.pem:/keys/jwt_private.pem:ro"
      - "./data/auth:/data"

  
  vault-service:
    build: ./vault-service
    volumes:
      - "./keys/jwt_public.pem:/keys/jwt_public.pem:ro"
      - "./data/vault:/data"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - "./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
      - "./frontend:/usr/share/nginx/html:ro"
    depends_on:
      - auth-service
      - vault-service
